version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: hermes-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  backend:
    build:
      context: ./backend
    container_name: hermes-backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - HERMES_API_URL=http://host.docker.internal:8000
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
    container_name: hermes-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  ollama-data:
